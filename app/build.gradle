plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'io.github.elsaphaba.adguardwaker'
    compileSdk 36
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'io.github.elsaphaba.adguardwaker'
        minSdk 31
        targetSdk 36
        versionCode 2
        versionName '1.1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
        // Release-level R8 shrinking, but signed with the debug keystore for testing.
        // This is NOT a production release signature.
        optimized {
            initWith release
            signingConfig signingConfigs.debug
            matchingFallbacks = ['release']
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
    }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
}
