plugins { id 'com.android.application' }
android {
    namespace 'io.github.elsaphaba.adguardwaker'
    compileSdk 37
    defaultConfig {
        applicationId 'io.github.elsaphaba.adguardwaker'
        minSdk 31
        targetSdk 37
        versionCode 1
        versionName '1.0.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }
}
