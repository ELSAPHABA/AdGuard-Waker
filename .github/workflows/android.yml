name: Android build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:?Android SDK is not installed on the runner}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          "$SDKMANAGER" --version
          if [[ -f "$SDK_ROOT/platforms/android-36/android.jar" && -x "$SDK_ROOT/build-tools/35.0.0/aapt2" ]]; then
            echo "Required Android SDK packages already installed."
            exit 0
          fi
          # yes can exit with SIGPIPE once sdkmanager accepts all licenses.
          (set +o pipefail; yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses)
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --channel=0 "platforms;android-36" "build-tools;35.0.0"
          test -f "$SDK_ROOT/platforms/android-36/android.jar"
          test -x "$SDK_ROOT/build-tools/35.0.0/aapt2"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Kotlin tests, APK build and lint
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: AdGuard-Waker-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
